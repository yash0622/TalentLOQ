<script>
        function selectTime(element) {
            // Remove selection from all buttons
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('border-primary', 'bg-primary-container/10');
                btn.classList.add('border-outline-variant');
                const text = btn.querySelector('span:first-child');
                text.classList.remove('text-primary', 'font-bold');
                text.classList.add('text-text-primary');
                const icon = btn.querySelector('.material-symbols-outlined');
                icon.classList.add('opacity-0');
                icon.style.fontVariationSettings = "'FILL' 0";
            });

            // Add selection to clicked button
            element.classList.add('border-primary', 'bg-primary-container/10');
            element.classList.remove('border-outline-variant');
            const text = element.querySelector('span:first-child');
            text.classList.add('text-primary', 'font-bold');
            const icon = element.querySelector('.material-symbols-outlined');
            icon.classList.remove('opacity-0');
            icon.style.fontVariationSettings = "'FILL' 1";
            
            // Update bottom bar (simulation)
            const timeVal = text.innerText;
            const bottomTime = document.querySelector('.max-w-4xl p.font-title-lg');
            if(bottomTime) bottomTime.innerText = `Oct 10 at ${timeVal}`;
        }
    </script>
