apiVersion: v1
kind: Secret
metadata:
  name: talentloq-secret
  namespace: talentloq
type: Opaque
stringData:
  # 256-bit secret key used for signing HS256 JWT tokens
  JWT_SECRET: "replace_with_a_secure_random_32_character_string"
  # Base64-encoded 32-byte AES-256 encryption key for sensitive PII data
  ENCRYPTION_KEY: "replace_with_base64_encoded_32_byte_key"
  # Optional: Groq LLM Cloud API Key for AI Applicant Screening
  GROQ_API_KEY: ""
  # Optional: Google Gemini API Key for Multimodal Marksheet OCR Extraction
  GEMINI_API_KEY: ""
