version: '3.8'

services:
  # 1. Database: MongoDB Server
  mongodb:
    image: mongo:6.0
    container_name: talentloq-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentloq-network

  # 2. Security Gateway & REST API: FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentloq-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=talentloq_db
      - JWT_SECRET=talentloq_jwt_secret_key_production_32bytes
      - JWT_ALGORITHM=HS256
      - ENCRYPTION_KEY=dGFsZW50bG9xX2Flc19lbmNyeXB0aW9uX2tleV8zMg==
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:8000,http://127.0.0.1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - talentloq-network

  # 3. Frontend Client: Flutter Web App served with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: talentloq-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - talentloq-network

volumes:
  mongo_data:
    driver: local

networks:
  talentloq-network:
    driver: bridge
